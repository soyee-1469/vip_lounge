<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토마톡 대전지사 3D 공간 모델 (추가 제안 반영)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEF; --panel:#FFFFFF; --ink:#1B2430; --muted:#5D6875; --line:#CBD2D9;
  --navy:#1E4D8C; --gold:#C49A22; --chip:#F2F4F6;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A21; --panel:#1E252E; --ink:#E8ECF0; --muted:#9AA5B1; --line:#33404D;
    --navy:#6E9BD9; --gold:#E0B84A; --chip:#27303A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A21; --panel:#1E252E; --ink:#E8ECF0; --muted:#9AA5B1; --line:#33404D;
  --navy:#6E9BD9; --gold:#E0B84A; --chip:#27303A; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:500;line-height:1.3;
  padding:3px 7px;border-radius:4px;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  white-space:nowrap;pointer-events:auto;cursor:pointer}
.lbl.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.lbl small{display:block;font-size:10px;color:var(--muted);font-weight:400}

aside{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;width:300px;max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
h1{font-size:17px;margin:0 0 4px;font-weight:700;letter-spacing:-0.01em}
.ver{font-size:12px;color:var(--muted);margin:0 0 14px}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:8px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:7px 4px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--navy);font-weight:700;box-shadow:0 0 0 1px var(--line)}
button:focus-visible,.lbl:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;font-size:12px;color:var(--muted);margin-bottom:14px}
.sw{width:14px;height:14px;border-radius:3px;margin-top:1px}
#info{border-top:1px solid var(--line);padding-top:12px}
#info h2{font-size:15px;margin:0 0 6px}
#info p{font-size:13px;line-height:1.6;margin:0 0 6px}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:4px;margin-right:4px;background:var(--chip);color:var(--muted)}
.tag.draft{color:var(--gold)}
.tag.fixed{color:var(--navy)}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:5;
  background:var(--panel);color:var(--ink);border:1px solid var(--ink);border-radius:8px;
  padding:10px 14px;font:inherit;font-size:14px;font-weight:700;text-decoration:none}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 14px}
@media (max-width:640px){
  aside{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:8px;right:8px;width:auto;max-height:42%}
  .back{top:calc(env(safe-area-inset-top,0px) + 8px);right:8px}
}
</style>
</head>
<body>
<a class="back" href="/">배치안으로 돌아가기</a>
<div id="stage"></div>
<div id="labels" aria-hidden="false"></div>

<aside>
  <h1>토마톡 대전지사 공간 모델</h1>
  <p class="ver">용두동 신규 건물 2층 · 2026.11.27 실측 배치</p>

  <div class="seg" role="group" style="display:none" aria-label="층 선택">
    <button data-view="2f" aria-pressed="false">2층</button>
    <button data-view="4" aria-pressed="false">4층</button>
    <button data-view="all" aria-pressed="true">전체</button>
  </div>

  <p class="hint" id="allNote" style="margin:-6px 0 10px"></p>
  <label class="toggle"><input type="checkbox" id="lblToggle" checked> 공간 이름 표시</label>

  <div class="legend" id="legend" style="display:none"></div>

  <div id="info">
    <p class="hint">공간을 누르면 요구사항과 면적이 표시됩니다. 드래그로 회전, 휠·두 손가락으로 확대할 수 있습니다.</p>
  </div>

  <p class="note" style="display:none">11/26 레이아웃 기준: VIP 라운지(판매·결제 카운터·체험 대기·파우더룸)는 파티션 없이 오픈, 관리실 1~4, 미팅실 2실, 지사장실 1~4, 탕비실, 통합 업무 라운지, 통유리 회장실. 4층 세미나 홀(강단 동측 정중앙, 64석) · 테라스. 면적은 도면 치수 기준 추정치.</p>
</aside>

const CX=37.9/2, CY=17.59/2;               // 모델 중심
const P=(x,y,z)=>new THREE.Vector3(x-CX,z,-(y-CY)); // 도면(x,y)+높이 → 3D

const floorGroups={}, pickables=[], labelItems=[];
const lineMat=new THREE.LineBasicMaterial({color:0x2b3640,transparent:true,opacity:0.55});

function addBox(group,zone,x,y,w,d,h,level){
  const gdef=GROUPS[zone.g];
  // 테이블, 스툴, 의자는 원통으로 그린다(회의 테이블과 소파는 제외)
  const round=/화분|라운지 테이블|카페 테이블|카페 의자|컵 테이블|상담 테이블|사이드 테이블|스툴|상담 의자|매니저 의자|회의 의자/.test(zone.n);
  const geo=round ? new THREE.CylinderGeometry(Math.min(w,d)/2,Math.min(w,d)/2,h,28) : new THREE.BoxGeometry(w,h,d);
  const solid = h>0.2;
  // 가구와 추가 제안은 실제 색으로 불투명하게, 방의 부피 상자는 옅게 그려서 안이 보이게 한다
  const NC=[[/화장품 선반/,0xF4EEE2],[/화장품 제품/,0xA8744F],[/커피머신/,0x2B2B2B],[/잔 트레이/,0xCFC6B6],[/창살/,0xFAF7F2],[/브랜드 월/,0xD2A48C],[/TV/,0x1C1C1C],[/상담 의자/,0x1F2A55],[/발마사지기/,0x8FA57E],[/테이블/,0x2B2B2B],
    [/소파|체어|벤치|의자|스툴/,0xEFE8DA],[/안내데스크|화장대|카운터/,0xF6F1E8],[/인증서/,0xC8A75A],[/진열/,0xE4D8C4],[/커피바/,0xD8C3A5],[/베드|침대/,0xFFFFFF],[/세면/,0xDDE7EC],[/트롤리|카트|협탁/,0xCFC6B6],[/미용기기/,0xB9C2C9],[/라커/,0xD9D2C4],[/데스크/,0xEDE6DA]];
  const hitc=NC.find(r=>r[0].test(zone.n));
  const opaque = !zone.glass && (zone.g==='furn' || /창살|브랜드 월/.test(zone.n));
  const mat=new THREE.MeshLambertMaterial({color: opaque&&hitc ? hitc[1] : gdef.color, transparent:!opaque,
    opacity: opaque?1 : zone.glass?0.25 : solid ? (zone.g==='core'?0.55:(zone.g==='skin'||zone.g==='path')?0.16:0.42) : 0.85});
  const m=new THREE.Mesh(geo,mat);
  m.position.copy(P(x+w/2,y+d/2,level+0.22+(zone.z0||0)+h/2));   // z0: 바닥에서 띄운 높이(상부장, 카운터 위 기기)
  m.userData.zone=zone;
  group.add(m); pickables.push(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),lineMat);
  e.position.copy(m.position); group.add(e);
  if(zone.st==='open'){ mat.opacity*=0.6; }
  return m;
}

function addStair(group,z,x,y,w,d,level){
  const N=12, H=2.8, mat=new THREE.MeshLambertMaterial({color:GROUPS.circ.color});
  for(let i=0;i<N;i++){
    const hh=(i+1)*H/N;
    let gx,gy,gw,gd;
    if(z.stair==='x'){gw=w/N; gd=d; gx=x+i*gw; gy=y;} else {gw=w; gd=d/N; gx=x; gy=y+i*gd;}
    const geo=new THREE.BoxGeometry(gw,hh,gd);
    const m=new THREE.Mesh(geo,mat); m.position.copy(P(gx+gw/2,gy+gd/2,level+0.22+hh/2)); group.add(m);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),lineMat); e.position.copy(m.position); group.add(e);
  }
  const hit=new THREE.Mesh(new THREE.BoxGeometry(w,H,d),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  hit.position.copy(P(x+w/2,y+d/2,level+0.22+H/2)); hit.userData.zone=z; group.add(hit); pickables.push(hit);
  return hit;
}
const doorMat=new THREE.MeshLambertMaterial({color:0xF5F1E6});
const doorEdge=new THREE.LineBasicMaterial({color:0xC49A22});
function addDoor(group,dr,x,y,w,d,level){
  const DW=dr.w||0.9, DH=2.1, T=0.07;
  let cx,cy,gw,gd;
  if(dr.side==='S'){cx=x+w*dr.at; cy=y-T/2; gw=DW; gd=T;}
  else if(dr.side==='N'){cx=x+w*dr.at; cy=y+d+T/2; gw=DW; gd=T;}
  else if(dr.side==='W'){cx=x-T/2; cy=y+d*dr.at; gw=T; gd=DW;}
  else {cx=x+w+T/2; cy=y+d*dr.at; gw=T; gd=DW;}
  const geo=new THREE.BoxGeometry(gw,DH,gd);
  const m=new THREE.Mesh(geo,doorMat); m.position.copy(P(cx,cy,level+0.22+DH/2)); group.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),doorEdge); e.position.copy(m.position); group.add(e);
  if(dr.slide&&(dr.side==='S'||dr.side==='N')){
    // 미닫이: 문은 벽 가운데에 닫힌 채로 두고, 문 위 레일이 동쪽으로 문 폭만큼 더 뻗는다(문짝이 밀려 가는 자리)
    const out=dr.side==='S'?-1:1, ry=cy+out*0.06;
    const rg=new THREE.BoxGeometry(DW*2,0.06,0.06);
    const r=new THREE.Mesh(rg,new THREE.MeshLambertMaterial({color:0x6b5a3e})); r.position.copy(P(cx+DW/2,ry,level+0.22+DH+0.05)); group.add(r);
    const hg=new THREE.BoxGeometry(0.04,0.3,0.04);   // 손잡이(문 서쪽 끝)
    const hd=new THREE.Mesh(hg,new THREE.MeshLambertMaterial({color:0x2b2622})); hd.position.copy(P(cx-DW/2+0.1,ry,level+0.22+1.0)); group.add(hd);
  }
}
function addPoly(group,zone,level){
  const gdef=GROUPS[zone.g];
  const shape=new THREE.Shape(zone.poly.map(([x,y])=>new THREE.Vector2(x-CX,(y-CY))));
  const geo=new THREE.ExtrudeGeometry(shape,{depth:Math.max(zone.h,0.02),bevelEnabled:false});
  const mat=new THREE.MeshLambertMaterial({color:gdef.color,transparent:true,opacity:0.85});
  const m=new THREE.Mesh(geo,mat); m.rotation.x=-Math.PI/2; m.position.y=level+0.22; m.userData.zone=zone;
  group.add(m); pickables.push(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),lineMat); e.rotation.x=-Math.PI/2; e.position.y=level+0.22; group.add(e);
  return m;
}

  const g=new THREE.Group(); floorGroups[f.id]=g; scene.add(g);
  // 슬래브
  const shape=new THREE.Shape(f.slab.map(([x,y])=>new THREE.Vector2(x-CX,(y-CY))));
  const sg=new THREE.ExtrudeGeometry(shape,{depth:0.22,bevelEnabled:false});
  const slab=new THREE.Mesh(sg,new THREE.MeshLambertMaterial({color:0xd6dbe0}));
  slab.rotation.x=-Math.PI/2; slab.position.y=f.level; g.add(slab);
  const se=new THREE.LineSegments(new THREE.EdgesGeometry(sg),lineMat);
  se.rotation.x=-Math.PI/2; se.position.y=f.level; g.add(se);
  // 외벽 윤곽(낮은 벽)
  const pts=f.slab.concat([f.slab[0]]).map(([x,y])=>P(x,y,f.level+0.22));
  const top=f.slab.concat([f.slab[0]]).map(([x,y])=>P(x,y,f.level+1.1));
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lineMat));
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(top),new THREE.LineBasicMaterial({color:0x2b3640,transparent:true,opacity:0.25})));
  // 4층: 실내/옥상 경계 벽
  if(f.id==='4'){
    const wall=[[23.05,2.98],[23.05,17.59]];
  }
  f.zones.forEach(z=>{
    const n=z.split||1, w=z.w/n;
    let rep;
    for(let i=0;i<n;i++){
      const sx=z.x+i*w, sw=w-(n>1?0.08:0);
      const m = z.poly ? addPoly(g,z,f.level) : z.stair ? addStair(g,z,sx,z.y,sw,z.d,f.level) : addBox(g,z,sx,z.y,sw,z.d,z.h,f.level); if(i===0)rep=m;
      (z.doors||[]).forEach(dr=>addDoor(g,dr,sx,z.y,sw,z.d,f.level));
    }
    if(z.canopy){
      const c=new THREE.Mesh(new THREE.BoxGeometry(z.w,0.06,z.d),
        new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.18}));
      c.position.copy(P(z.x+z.w/2,z.y+z.d/2,f.level+3.0)); g.add(c);
      const ce=new THREE.LineSegments(new THREE.EdgesGeometry(c.geometry),lineMat); ce.position.copy(c.position); g.add(ce);
    }
    if(z.g==='green'||z.nolabel) return;
    const el=document.createElement('div'); el.className='lbl'; el.tabIndex=0;
    el.innerHTML=z.n+(z.s?`<small>${z.s}</small>`:'');
    el.addEventListener('click',()=>select(z));
    el.addEventListener('keydown',e=>{if(e.key==='Enter')select(z);});
    labelsEl.appendChild(el);
    labelItems.push({el,z,floor:f.id,pos:P(z.lx!==undefined?z.lx:z.x+z.w/2,z.ly!==undefined?z.ly:z.y+z.d/2,f.level+0.22+Math.max(z.h,0.1)+0.4)});
  });
});

/* 범례 */
const lg=document.getElementById('legend');
Object.values(GROUPS).forEach(g=>{lg.insertAdjacentHTML('beforeend',`<span class="sw" style="background:${g.css}"></span><span>${g.name}</span>`)});
lg.insertAdjacentHTML('beforeend',`<span class="sw" style="background:#F5F1E6;border:2px solid #C49A22"></span><span>출입문</span>`);

/* 선택 */
let selected=null;
const stLabel={fixed:['fixed','미팅 확정'],draft:['draft','가안'],open:['','미정']};
function select(z){
  selected=z;
  const ar=z.area||z.w*z.d; const area=ar.toFixed(1), py=(ar/3.3058).toFixed(1);
  const [cls,txt]=stLabel[z.st];
  const per=z.split?` (${z.split}실, 실당 약 ${(z.w*z.d/z.split).toFixed(1)}㎡)`:'';
  document.getElementById('info').innerHTML=
    `<h2>${z.n}</h2><p><span class="tag ${cls}">${txt}</span><span class="tag">${GROUPS[z.g].name}</span></p>`+
    `<p>면적 약 ${area}㎡ · ${py}평${per}</p><p>${z.t}</p>`;
  labelItems.forEach(l=>l.el.classList.toggle('sel',l.z===z));
}

/* 층 전환 */
let view='all';
function setView(v){
  view=v;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
  floorGroups['2f'].visible = v!=='4';
  floorGroups['4'].visible  = v!=='2f';
  floorGroups['4'].position.y = v==='4' ? -4.2 : 0;
  document.getElementById('allNote').textContent = '';
  frame();
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
// 고객 구역이 있는 2층부터 보여 준다 (?view=all 로 전체)
setTimeout(()=>setView('2f'),0); /* 2층 고정 */
document.getElementById('lblToggle').addEventListener('change',e=>{labelsEl.style.display=e.target.checked?'':'none'});

function frame(){
  const dist = view==='all'? 46 : 40;
  camera.position.set(-dist*0.45, dist*0.75, dist*0.75);
  controls.target.set(0, view==='all'?2:0.5, 0);
  controls.update();
}

/* 클릭 피킹 */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5)return;
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables.filter(m=>m.parent.visible),false)[0];
  if(hit) select(hit.object.userData.zone);
});

/* 리사이즈·루프 */
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
const v3=new THREE.Vector3();
function tick(){
  controls.update(); renderer.render(scene,camera);
  const w=stage.clientWidth,h=stage.clientHeight;
  labelItems.forEach(l=>{
    const g=floorGroups[l.floor];
    if(!g.visible){l.el.style.display='none';return;}
    v3.copy(l.pos); v3.y+=g.position.y; v3.project(camera);
    if(v3.z>1){l.el.style.display='none';return;}
    l.el.style.display='';
    l.el.style.left=((v3.x+1)/2*w)+'px'; l.el.style.top=((1-v3.y)/2*h)+'px';
  });
  requestAnimationFrame(tick);
}
resize(); setView('all'); tick();
</script>
</body>
